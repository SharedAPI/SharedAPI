name: Mirror to AstralServer/SharedAPI

on:
  push:
    branches:
      - "main"

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source with full history
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Git
        run: |
          git config user.name "Traqueur-dev"
          git config user.email "traqueur.dev@gmail.com"

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install PyGithub
        run: pip install PyGithub

      - name: Run Python script to mirror branch
        env:
          SOURCE_BRANCH: "main"
          TARGET_REPO: "AstralServer/SharedAPI"
          SOURCE_REPO: "SharedAPI/SharedAPI"
          MIRROR_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          python mirror_push.py