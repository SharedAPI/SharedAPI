name: Mirror to {TARGET_ORG}/{REPO_NAME}

on:
  push:
    branches:
      - {BRANCH_NAME}

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Git
        run: |
          git config user.name "{GITHUB_ACTOR}"
          git config user.email "{GITHUB_EMAIL}"

      - name: Push to target repo via HTTPS
        env:
          TARGET_REPO_URL: https://${{ secrets.{SECRET_NAME} }}@github.com/{TARGET_ORG}/{REPO_NAME}.git
        run: |
          git remote add dest "$TARGET_REPO_URL"
          git push --force dest {BRANCH_NAME}