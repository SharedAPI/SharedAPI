name: Mirror to AstralServer/SharedAPI

on:
  push:
    branches:
      - main

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Git
        run: |
          git config user.name "Traqueur_"
          git config user.email "traqueur.dev@gmail.com"

      - name: Push to target repo
        env:
          DEST_REPO: git@github.com:AstralServer/SharedAPI.git
          SSH_PRIVATE_KEY: ${{ secrets.DEST_REPO_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git remote add dest "$DEST_REPO"
          git push --force dest main