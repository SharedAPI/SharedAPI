name: Mirror to AstralServer/SharedAPI

on:
  push:
    branches:
      - main

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Git
        run: |
          git config user.name "Traqueur_"
          git config user.email "traqueur.dev@gmail.com"

      - name: Push to target repo via HTTPS
        env:
          TARGET_REPO_URL: https://${ secrets.PERSONAL_ACCESS_TOKEN }@github.com/AstralServer/SharedAPI.git
        run: |
          git remote add dest "$TARGET_REPO_URL"
          git push --force dest main